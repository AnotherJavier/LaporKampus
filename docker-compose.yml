name: lapor-kampus

services:
  postgres:
    image: postgres:16-alpine
    container_name: lapor-kampus-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-lapor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lapor}
      POSTGRES_DB: ${DB_NAME:-lapor_kampus}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:9.0
    container_name: lapor-kampus-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: lapor-kampus-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Profil "app" menjalankan aplikasi di dalam Docker. Default `make up`
  # hanya menyalakan infrastruktur agar kode dapat dijalankan dari host.
  api:
    profiles: ["app"]
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
    container_name: lapor-kampus-api
    env_file: .env
    environment:
      APP_ROLE: api
      DB_HOST: postgres
      DB_PORT: 5432
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
    container_name: lapor-kampus-worker
    # Worker tidak membuka HTTP, jadi healthcheck HTTP dari Dockerfile
    # tidak berlaku untuk container ini.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      APP_ROLE: worker
      DB_HOST: postgres
      DB_PORT: 5432
      MONGO_URI: mongodb://mongo:27017
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:
